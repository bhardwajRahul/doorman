services:
  redis:
    image: redis:7-alpine
    network_mode: host
    command:
      - redis-server
      - --bind
      - 127.0.0.1
      - --port
      - "${DOORMAN_TEST_REDIS_PORT:-16379}"
      - --save
      - ""
      - --appendonly
      - "no"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p ${DOORMAN_TEST_REDIS_PORT:-16379} ping | grep -qx PONG"]
      interval: 2s
      timeout: 2s
      retries: 20

  mongo:
    image: mongo:7
    network_mode: host
    command:
      - mongod
      - --port
      - "${DOORMAN_TEST_MONGO_PORT:-27018}"
      - --replSet
      - rs0
      - --bind_ip
      - 127.0.0.1
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --port ${DOORMAN_TEST_MONGO_PORT:-27018} --eval 'try { rs.status().ok } catch (error) {
          rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:${DOORMAN_TEST_MONGO_PORT:-27018}"}]}).ok }'
          | grep -qx 1
      interval: 2s
      timeout: 3s
      retries: 20
